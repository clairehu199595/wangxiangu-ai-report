<!doctype html>
<html lang="zh-CN">

  <title>望小仙｜望仙谷手机端</title>
  <style>
    :root{

    .main{display:flex;min-width:0;min-height:0;overflow:hidden;flex-direction:column;background:var(--paper)}

    .room-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.room-card{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff}.room-card img{display:block;width:100%;aspect-ratio:1.42/1;object-fit:cover;background:var(--mist)}.room-info{padding:9px}.room-title{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--green);font-size:13px;font-weight:700}.room-price{flex:0 0 auto;color:#9a7130;font-size:11px}.room-meta{margin-top:3px;color:var(--muted);font-size:10px;line-height:1.45}.room-stock{display:inline-flex;align-items:center;margin-top:6px;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:700}.room-stock.available{background:#e8f5eb;color:#287440}.room-stock.limited{background:#fff1dc;color:#a35d00}.room-stock.sold{background:#fdebea;color:#a23b35}.room-stock.pending{background:#eef0f2;color:#687078}.room-select{width:100%;margin-top:7px;padding:6px 8px;border:1px solid var(--green-2);border-radius:8px;background:#fff;color:var(--green);font-size:11px;font-weight:700}.room-select:disabled{border-color:#d9ddda;background:#eef0ee;color:#969d98;cursor:not-allowed}
    .dining-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:12px}.shop-section{padding:12px;border:1px solid #d6e0d7;border-radius:15px;background:#f6f8f4}.shop-section.wide{margin-top:12px}.shop-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--green);font-size:14px;font-weight:800}.shop-section-title span{color:var(--muted);font-size:10px;font-weight:500}.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.shop-section:not(.wide) .shop-grid{grid-template-columns:1fr}.shop-card{padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff}.shop-name{font-weight:700;color:var(--green);font-size:13px}.shop-meta{margin:3px 0 8px;color:var(--muted);font-size:11px}.product{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px dashed #dde3dc;font-size:12px}.add-btn{flex:0 0 auto;border:1px solid var(--green-2);border-radius:8px;background:#fff;color:var(--green);padding:5px 8px;font-size:11px}.cart-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding:10px 11px;border-radius:12px;background:var(--green);color:#fff;font-size:12px}.cart-btn,.order-btn{border:0;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:700}.cart-btn{background:#fff;color:var(--green)}.order-btn{background:var(--gold);color:#fff}.cart-lines{margin:9px 0;padding:0;list-style:none}.cart-lines li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}.mode-row{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.mode-btn{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--green);font-size:11px}.mode-btn.selected{border-color:var(--green);background:var(--mist);font-weight:700}.order-slip{margin-top:10px;padding:13px;border:1px solid #d8c99f;border-radius:13px;backg     var ATTRACTION_GUIDES = {"白鹤村":{"name":"白鹤村","aliases":["悬崖旅居聚落"],"status":"现有资料收录","short":"这里是白鹤村。白鹤村因崖得名，依山而筑，其前身是南北朝时期白鹤崖上修士们建造的悬空茅庐。南北朝时期，大量民间修士进入灵山寻找洞天福地修行。","standard":"各位游客，我们现在来到的是白鹤村。白鹤村因崖得名，依山而筑，其前身是南北朝时期白鹤崖上修士们建造的悬空茅庐。南北朝时期，大量民间修士进入灵山寻找洞天福地修行。后来白鹤崖上的茅庐越建越多，形制各异，逐渐形成围绕朝鹤楼排布的建筑群，成为望仙谷一道奇景。如今的白鹤村民居基本分布在崖壁的腰部、顶部、背部。在当地故事中，一部分修士来到望仙地界后，听闻胡昭曾在白鹤崖上结庐修行，还留有白鹤救民的圣迹，便纷纷在白鹤崖上搭建茅庐，修习道法，希望能得白鹤接引，飞升成仙。"},"云海崖":{"name":"云海崖","aliases":["悬崖博物馆群"],"status":"现有资料收录","short":"这里是云海崖。云海崖，是望仙谷内继白鹤崖之后又一个核心景点。它地处灵山北麓饶北河峡谷南段，隶属于华南板块与扬子板块交界带的赣东北北东向深大断裂构造域，位于灵山环状花岗岩体与信江白垩纪断陷盆地的过渡交汇区，是多期内动力构造运动与外动力地质作用长期耦合塑造的侵蚀构造型花岗岩陡崖地貌，局部叠加丹霞地貌特征，是赣东北灵山构造带地貌演化的典型产物。","standard":"各位游客，我们现在来到的是云海崖。云海崖，是望仙谷内继白鹤崖之后又一个核心景点。它地处灵山北麓饶北河峡谷南段，隶属于华南板块与扬子板块交界带的赣东北北东向深大断裂构造域，位于灵山环状花岗岩体与信江白垩纪断陷盆地的过渡交汇区，是多期内动力构造运动与外动力地质作用长期耦合塑造的侵蚀构造型花岗岩陡崖地貌，局部叠加丹霞地貌特征，是赣东北灵山构造带地貌演化的典型产物。云海崖因其地处饶北河深切峡谷的水汽通道，峡谷呈南北走向，与区域主导风向一致，暖湿气流可沿峡谷长驱直入，受高陡崖壁阻挡被迫抬升，绝热冷却后发生水汽凝结；同时谷底的饶北河常年流水持续补给水汽，加之崖体与谷底的巨大高差形成显著的局地热力环流。所以，每逢湿热的清晨、雨后及秋冬季节便极易形成大面积层积云与云海，陡崖上常年云雾环绕，形成了望仙谷中独特的自然景观。在当地故事中，望仙谷曾将发生在这里的一段历史传说改编成仙侠小说，书名叫《云海传奇》，目前发布在起点平台上。"},"岩铺村":{"name":"岩铺村","aliases":["岩铺老街"],"status":"现有资料收录","short":"这里是岩铺村。岩铺村是望仙历史悠久的自然村，建村历史最早可追溯至三国时期。此处盛产石料，常有赣南地区乃至福建的客商前来订购，石料供不应求，村民便逐渐从农耕转以石料贸易为生。","standard":"各位游客，我们现在来到的是岩铺村。岩铺村是望仙历史悠久的自然村，建村历史最早可追溯至三国时期。此处盛产石料，常有赣南地区乃至福建的客商前来订购，石料供不应求，村民便逐渐从农耕转以石料贸易为生。除石料商铺外，客栈、车马行、铁匠、木匠等行业也陆续落户于此，发展成热闹的商业村落，遂得名“岩铺村”。岩铺村总占地约28.8亩，东西长约八十四丈，南北宽约三十六丈。"},"揽月桥":{"name":"揽月桥","aliases":[],"status":"现有资料收录","short":"这里是揽月桥。明嘉靖十五年（公元1536年），望仙金氏为通两岸商贸，于饶北河上修建一座石拱桥，竣工之日恰逢农历八月十五，正应花好月圆之意，因此得名揽月桥。清乾隆三十四年（公元1769年）六月，饶北河突发山洪，滚落的巨石撞毁了桥体，随后又由望仙杨氏后人出资重建。","standard":"各位游客，我们现在来到的是揽月桥。明嘉靖十五年（公元1536年），望仙金氏为通两岸商贸，于饶北河上修建一座石拱桥，竣工之日恰逢农历八月十五，正应花好月圆之意，因此得名揽月桥。清乾隆三十四年（公元1769年）六月，饶北河突发山洪，滚落的巨石撞毁了桥体，随后又由望仙杨氏后人出资重建。重建后的揽月桥，桥身设计依照桥名做了微调，修成了圆拱式石拱桥，露出水面的桥拱加上水下部分，恰好凑成一轮完满的圆月。相传曾有女眷登桥向月神祈求姻缘，得偿所愿后，“揽月同心”的佳话便在街坊间流传开来，常引来互有情意的才子佳人到此相会。"},"悬崖图书馆":{"name":"悬崖图书馆","aliases":[],"status":"现有资料收录","short":"这里是悬崖图书馆。因望仙谷地势较低，内部水系发达，山谷每逢汛期必遭洪水。古时，书籍十分珍贵，在山谷中修行的修士和读书人为了避免藏书受损，便将书籍全部搬到悬崖上的茅庐中，并规定此处书籍只可翻阅不可带走。","standard":"各位游客，我们现在来到的是悬崖图书馆。因望仙谷地势较低，内部水系发达，山谷每逢汛期必遭洪水。古时，书籍十分珍贵，在山谷中修行的修士和读书人为了避免藏书受损，便将书籍全部搬到悬崖上的茅庐中，并规定此处书籍只可翻阅不可带走。这一规定虽增加了求学之难，但保全了所有珍贵的古书籍，从此留下了望仙谷悬崖藏书的故事。之后，便演变成如今屹立在悬崖上的白鹤书局。"},"腾云阁":{"name":"腾云阁","aliases":[],"status":"现有资料收录","short":"这里是腾云阁。腾云阁是云海崖建筑中高度最高、形制规模最大的四层方形楼阁式建筑，占地144平方米，总建筑面积251平方米，长宽各约四丈三尺，高约六丈，屋脊至河谷133米，整座纯木结构楼阁由十二根大柱锚入花岗岩峭壁，以此支撑整座建筑。楼阁取十二之数，暗合十二地支，隐喻一劳永逸。","standard":"各位游客，我们现在来到的是腾云阁。腾云阁是云海崖建筑中高度最高、形制规模最大的四层方形楼阁式建筑，占地144平方米，总建筑面积251平方米，长宽各约四丈三尺，高约六丈，屋脊至河谷133米，整座纯木结构楼阁由十二根大柱锚入花岗岩峭壁，以此支撑整座建筑。楼阁取十二之数，暗合十二地支，隐喻一劳永逸。全楼共二十四个翘角，青瓦筑脊；木构件不施油漆，尽显木材本色；屋顶覆小青瓦，转角依靠挑枋、牛腿出檐，翼角高挑，民间地方特色鲜明。整楼未用斗拱，抬头仰望便尽显朴素与壮观。在当地故事中，望见自己，即是神仙。"},"朝鹤楼":{"name":"朝鹤楼","aliases":[],"status":"现有资料收录","short":"这里是朝鹤楼。古时，每逢朔望，望仙乡民携稚子登崖祭拜祈福，童声高诵《白鹤行》。鹤影虽杳，而清唳犹在耳畔，早已成为此地道家文明教化之基、信众心灵所系之圣域。","standard":"各位游客，我们现在来到的是朝鹤楼。古时，每逢朔望，望仙乡民携稚子登崖祭拜祈福，童声高诵《白鹤行》。鹤影虽杳，而清唳犹在耳畔，早已成为此地道家文明教化之基、信众心灵所系之圣域。从河面到朝鹤楼顶的高度为108米，恰合“三十六天罡、七十二地煞”之数，暗喻道法周流、天地圆融。而这108之数，也是评定风调雨顺的标准：若河面抬升，高度差不足108米，则预示有水患来临；高度差大于108米，则预示旱情将至。在当地故事中，朝鹤楼是白鹤崖上最高的建筑，也是白鹤救民传说的具象化精神图腾。"},"圆山顶":{"name":"圆山顶","aliases":[],"status":"现有资料收录","short":"这里是圆山顶。主体基岩为燕山晚期早白垩世侵入型花岗岩，岩体形成距今约1.8亿年，是多期次脉动式岩浆侵入冷却形成的产物。最高海拔638米，与饶北河峡谷高差450米。","standard":"各位游客，我们现在来到的是圆山顶。主体基岩为燕山晚期早白垩世侵入型花岗岩，岩体形成距今约1.8亿年，是多期次脉动式岩浆侵入冷却形成的产物。最高海拔638米，与饶北河峡谷高差450米。规划占地116.21亩，用地长约625米，宽约245米，整体呈“勺子”形状，对应天上北斗七星。东侧为望仙水河谷与X004县道，北侧可俯瞰饶北河峡谷—望仙谷核心区，南侧为自然山体，有山路连通望仙乡，西侧同样为自然山体，山势绵延，一直延伸至望仙乡下辖的里方村。"},"圆山顶日出日落":{"name":"圆山顶日出日落","aliases":[],"status":"现有资料收录","short":"这里是圆山顶日出日落。圆山顶是典型花岗岩台地，中部为天心禅林寺院建筑，依山而建，坐西朝东。山顶视野开阔，绿意盎然，是观赏日出与日落的绝佳位置。","standard":"各位游客，我们现在来到的是圆山顶日出日落。圆山顶是典型花岗岩台地，中部为天心禅林寺院建筑，依山而建，坐西朝东。山顶视野开阔，绿意盎然，是观赏日出与日落的绝佳位置。站在山顶，游客可全方位感受昼夜交替的壮丽自然景象。清晨，在山顶观东方天际渐现鱼肚白，云层随之呈现出淡粉色渐变。在当地故事中，站在这处至高点，即可将所有夜间璀璨光景全部揽入眼底，仿佛仙人俯视人间，超凡脱俗。"},"九牛峡谷":{"name":"九牛峡谷","aliases":[],"status":"现有资料收录","short":"这里是九牛峡谷。九牛村早年原是一片荒山，仅有少数修行者在此隐居求道。隋唐乱世时，躲避战祸的难民纷纷涌入，这片土地逐渐发展为繁荣村落，至明清两代，已聚居了超过两百户人家。","standard":"各位游客，我们现在来到的是九牛峡谷。九牛村早年原是一片荒山，仅有少数修行者在此隐居求道。隋唐乱世时，躲避战祸的难民纷纷涌入，这片土地逐渐发展为繁荣村落，至明清两代，已聚居了超过两百户人家。为治理水患，隐居在此的修行者协力施展厌胜之法，将九块巨石点化为九头石牛：三牛镇于山中，二牛安于桥下，四牛伏于水中，以此镇压走蛟兴浪，此地遂得名“九牛村”。据考证，九牛村是灵山北麓传统农耕、山猎村落，也是古代徽饶古道支线节点，为沟通灵山南北、连接饶州与信州的山间要道。相传这里地势偏低，又临近水源，村中常遭洪水侵扰，百姓生计艰难。"},"胡氏宗祠":{"name":"胡氏宗祠","aliases":[],"status":"现有资料收录","short":"这里是胡氏宗祠。南宋时期，理学家朱熹著《家礼》订立祠堂之制，提倡修建祠堂以敬奉先祖。嘉靖十六年（公元1537年）春，望仙谷四大氏族中的胡氏举全族之力，在先祖胡昭旧居遗址上建起胡氏宗祠，供奉胡徽公-胡昭、胡弼公-胡文辅、胡资公-胡文义、万三公-胡梦昱等祖先的神主牌位。","standard":"各位游客，我们现在来到的是胡氏宗祠。南宋时期，理学家朱熹著《家礼》订立祠堂之制，提倡修建祠堂以敬奉先祖。嘉靖十六年（公元1537年）春，望仙谷四大氏族中的胡氏举全族之力，在先祖胡昭旧居遗址上建起胡氏宗祠，供奉胡徽公-胡昭、胡弼公-胡文辅、胡资公-胡文义、万三公-胡梦昱等祖先的神主牌位。胡氏宗祠是胡氏家族的管理中心，族中大事如祭祀、婚丧、修谱、立规、奖惩，皆在此商议裁决。过去此处还设有“族学”，族中的孩子在这里读书识字，接受最早的文化启蒙。"},"聚贤楼":{"name":"聚贤楼","aliases":["老围楼"],"status":"现有资料收录","short":"这里是聚贤楼。聚贤楼，也叫老围楼，地处仰仙村，是一座椭圆形两坡单层木结构围屋。长边半径八丈七尺，短边半径七丈三尺，总计二十八间，对应天上二十八星宿。","standard":"各位游客，我们现在来到的是聚贤楼。聚贤楼，也叫老围楼，地处仰仙村，是一座椭圆形两坡单层木结构围屋。长边半径八丈七尺，短边半径七丈三尺，总计二十八间，对应天上二十八星宿。整座建筑坐南朝北，正南方位为古戏台，正北方为面阔三间的外八字形门墙，隔街正对山神庙，东西两侧设门廊供人进出。戏台面阔三间，高四丈，是三重檐两坡建筑，正面上两层做重檐歇山状，正脊筑鎏金宝鼎，造型奇特，雕刻精美，尽显工艺之精湛。"},"承远楼":{"name":"承远楼","aliases":[],"status":"现有资料收录","short":"这里是承远楼。明永乐三年（公元1405年），望仙谷遭遇特大暴雨，聚贤楼被泥流冲毁。灾难过后，畲族后裔择仰仙村地势较高处重建了一座土楼，继续守护家园。","standard":"各位游客，我们现在来到的是承远楼。明永乐三年（公元1405年），望仙谷遭遇特大暴雨，聚贤楼被泥流冲毁。灾难过后，畲族后裔择仰仙村地势较高处重建了一座土楼，继续守护家园。为了保留老围楼的原址和原名，让后人铭记与刘伯温的约定，新楼便命名为承远楼，取“传承先贤意志，远扬先贤之思”之意。如今的承远楼已无畲族后裔居住，但依旧保留了畲族传统土楼的建筑形制，整体占地1730平方米，总建筑面积4230平方米，长十七丈，宽十三丈，高八丈，地上四层，地下一层，房间总计七十五间。"},"万三书舍":{"name":"万三书舍","aliases":[],"status":"现有资料收录","short":"这里是万三书舍。据《万三刚简公史》记载，胡氏十世祖胡梦昱，字季昭，号竹林愚隐，文水功德源人，生于宋淳熙十二年（公元1185年）。嘉定十年（公元1217年）考中进士，授南安军南安县主簿、南康军都昌县主簿，中法大科后任峡州司法，又除大理评事。","standard":"各位游客，我们现在来到的是万三书舍。据《万三刚简公史》记载，胡氏十世祖胡梦昱，字季昭，号竹林愚隐，文水功德源人，生于宋淳熙十二年（公元1185年）。嘉定十年（公元1217年）考中进士，授南安军南安县主簿、南康军都昌县主簿，中法大科后任峡州司法，又除大理评事。后因触怒权奸，遭诬陷贬至象州任职，宝庆二年（公元1226年）病逝于象州。端平元年（公元1234年）朝廷下诏为其复官，追谥刚简，取强毅果敢、正直无邪之意。"},"岩铺广场":{"name":"岩铺广场","aliases":["岩铺老茶馆"],"status":"现有资料收录","short":"这里是岩铺广场。自三国赤乌年间起，岩铺村因茶肆、酒坊、竹木之肆、匠作之铺、冶铁之炉、车马之行等商业兴盛，遂成一商业之村落，每逢朔望便有众多村民前来进行交易，人皆称之为岩铺墟集。为了方便运输货物，由岩铺金氏在饶北河设立码头，每日船只在河中迎来送往，运送村民或物资货品，呈现出繁荣景象。","standard":"各位游客，我们现在来到的是岩铺广场。自三国赤乌年间起，岩铺村因茶肆、酒坊、竹木之肆、匠作之铺、冶铁之炉、车马之行等商业兴盛，遂成一商业之村落，每逢朔望便有众多村民前来进行交易，人皆称之为岩铺墟集。为了方便运输货物，由岩铺金氏在饶北河设立码头，每日船只在河中迎来送往，运送村民或物资货品，呈现出繁荣景象。现今的岩铺广场是去往百味街和灵光街的分岔口，也是供游人歇息的场所。由四个高低不一的两层建筑围合成方形庭院，占地约一百六十平方米。"},"双寿承恩牌坊":{"name":"双寿承恩牌坊","aliases":[],"status":"现有资料收录","short":"这里是双寿承恩牌坊。望仙胡氏第八十三世传人胡尚志，生于弘治庚申年（公元1500年）。受先祖遗风熏陶，笃信道教，一生为人和善温厚，处事公正不阿，子孙繁茂，被乡邻尊为村中多福之人。","standard":"各位游客，我们现在来到的是双寿承恩牌坊。望仙胡氏第八十三世传人胡尚志，生于弘治庚申年（公元1500年）。受先祖遗风熏陶，笃信道教，一生为人和善温厚，处事公正不阿，子孙繁茂，被乡邻尊为村中多福之人。其妻周氏贤良淑德，虽家境富庶，却素以节俭持家，为胡氏悉心抚育子女，教导他们忠君爱国，铭记祖宗恩荣。万历二十八年（公元1600年），明神宗朱翊钧闻知上饶县有百岁夫妻，以为祥瑞之兆，随即钦封二人为“寿官”，享有八品官员的待遇与俸禄，并特赐“双寿承恩”牌坊一座，以彰其德。"},"五洋桥":{"name":"五洋桥","aliases":[],"status":"现有资料收录","short":"这里是五洋桥。据《胡氏宗谱》记载，晋武帝泰始元年（公元265年）太子得疾不愈，武帝下诏求医，有一道士应诏前来，手到病除。武帝遂敕封拥笔峰为仙峰，封胡超为胡公真人。","standard":"各位游客，我们现在来到的是五洋桥。据《胡氏宗谱》记载，晋武帝泰始元年（公元265年）太子得疾不愈，武帝下诏求医，有一道士应诏前来，手到病除。武帝遂敕封拥笔峰为仙峰，封胡超为胡公真人。此事传开后，前来灵山求医问药、寻访胡氏家族的人络绎不绝，其中不乏乘车而来的病患。但望仙谷内原有桥梁年久失修、通道狭窄，无法满足通行需求，为让重型车辆顺利进出谷中，岩铺金氏集资在河谷两岸修建了一座宽一丈余的通车木桥，命名为五羊桥。在当地故事中，武帝问其籍贯姓名，道士随即腾空答曰：“贫道乃信州灵山北五羊拥笔峰人胡超也”，随后化作青烟离去。"},"会仙桥":{"name":"会仙桥","aliases":[],"status":"现有资料收录","short":"这里是会仙桥。会仙桥虽名为桥，实则是一座悬挂于云海崖崖壁上的三拱石桥，衔接着东西两侧悬崖的古建。整座桥占地118平方米，长约十二丈、宽一丈三尺、拱高两丈。","standard":"各位游客，我们现在来到的是会仙桥。会仙桥虽名为桥，实则是一座悬挂于云海崖崖壁上的三拱石桥，衔接着东西两侧悬崖的古建。整座桥占地118平方米，长约十二丈、宽一丈三尺、拱高两丈。东西侧共设台阶六十六步、南北侧共设望柱四十二根。地面和地伏石采用花岗岩火烧面，青石栏板做三遍剁斧处理，青石望柱做扁光处理，整体厚重素雅。在当地故事中，入夜后更像是悬在空中的仙桥，只可远观而不可攀，唯有四方仙人会登临此处，相会于人间，因此名为会仙桥。"},"天同客栈":{"name":"天同客栈","aliases":[],"status":"现有资料收录","short":"这里是天同客栈。这座客栈是望仙谷的仙侠小说《云海传奇》中的剧情建筑。它的名字取自于儒家经典《礼记·礼运》中的《大道之行也》，代表希望人们友爱互助，家家安居乐业，和平共生，天下大同的美好理念。","standard":"各位游客，我们现在来到的是天同客栈。这座客栈是望仙谷的仙侠小说《云海传奇》中的剧情建筑。它的名字取自于儒家经典《礼记·礼运》中的《大道之行也》，代表希望人们友爱互助，家家安居乐业，和平共生，天下大同的美好理念。故事中，岩铺大老板金算子发现望仙商业前景巨大，往来商人却没有方便的下榻之处，便买下一座老楼改建成“天同客栈”，接待四方来客。后来在保护望仙谷的战斗中，天同客栈成为歼灭妖魔的主战场之一，最终连同妖魔一起被焚为灰烬。"},"朔望牌坊":{"name":"朔望牌坊","aliases":[],"status":"现有资料收录","short":"这里是朔望牌坊。朔望牌坊坐落于朔望街东首，始建于清乾隆四十二年（公元1777年），光绪二十年（公元1894年）重修，现存形制即为重修后的样式。其修建源于一段发生在乾隆年间的诚信佳话。","standard":"各位游客，我们现在来到的是朔望牌坊。朔望牌坊坐落于朔望街东首，始建于清乾隆四十二年（公元1777年），光绪二十年（公元1894年）重修，现存形制即为重修后的样式。其修建源于一段发生在乾隆年间的诚信佳话。当时，在灵光街做药材生意的胡德昌秉持“朔望之期，童叟无欺”的信条，深受百姓信赖。他每月初一、十五都会在墟集设义诊，还承诺无论药价如何涨跌，对街坊邻里一律按平价交易，绝不以次充好。"},"三神庙":{"name":"三神庙","aliases":[],"status":"现有资料收录","short":"这里是三神庙。明清之前，望仙百姓以耕种、狩猎与渔获作为主要营生，但一年的收成全凭天意。为祈求风调雨顺，望仙百姓在村中修建了土地庙与龙王庙两座神庙，每逢初一、十五便虔诚祭拜，期盼众神护佑这片土地。","standard":"各位游客，我们现在来到的是三神庙。明清之前，望仙百姓以耕种、狩猎与渔获作为主要营生，但一年的收成全凭天意。为祈求风调雨顺，望仙百姓在村中修建了土地庙与龙王庙两座神庙，每逢初一、十五便虔诚祭拜，期盼众神护佑这片土地。顺治七年（公元1650年），望仙杨氏第二代家主为重振家族商贸，专程赴南昌恭请文财神比干圣像，供奉于岩铺村。经村民共同商议，决定将土地神、龙王与财神三圣像合祀一处；杨氏慷慨解囊，斥资将原财神庙改建为三神庙，使三位正神得以共佑望仙子民。"},"白鹤崖":{"name":"白鹤崖","aliases":[],"status":"现有资料收录","short":"这里是白鹤崖。赤乌十年，望仙突发洪水，百姓家园俱毁。而后众白鹤立于崖上高亢长鸣不休，竟令洪水逐渐退去，恢复山谷安宁。","standard":"各位游客，我们现在来到的是白鹤崖。赤乌十年，望仙突发洪水，百姓家园俱毁。而后众白鹤立于崖上高亢长鸣不休，竟令洪水逐渐退去，恢复山谷安宁。村民见状，认为白鹤乃神灵派遣下凡搭救众生，便将悬松崖更名为白鹤崖，于崖顶建造朝鹤楼以示感念。白鹤崖在望仙谷处于三山汇聚、两河汇流的地方。在当地故事中，白鹤崖古时又名悬松崖，据传是胡昭曾经修炼的福地。"},"闲鹤阁":{"name":"闲鹤阁","aliases":[],"status":"现有资料收录","short":"这里是闲鹤阁。明清时期，村中豪绅重修朝鹤楼，并于一侧建闲鹤阁做书房，供族中子弟学习儒、道经典，与朝鹤楼在崖壁上遥相辉映。闲鹤阁为纯木结构清式楼阁，占地约240平方米，宽五丈，进深五丈六尺，高约五丈。","standard":"各位游客，我们现在来到的是闲鹤阁。明清时期，村中豪绅重修朝鹤楼，并于一侧建闲鹤阁做书房，供族中子弟学习儒、道经典，与朝鹤楼在崖壁上遥相辉映。闲鹤阁为纯木结构清式楼阁，占地约240平方米，宽五丈，进深五丈六尺，高约五丈。全楼共有八十五攒单翘三踩斗拱，选用斗口八等材，覆小青瓦屋顶。其前殿整体布局呈“太师椅状”，左右两侧有爬山廊环抱，左侧青龙出头位置布置歇山门厅；建筑主体由两栋重檐歇山建筑前后相依组合而成，形成前殿后阁的布局。"},"白鹤桥":{"name":"白鹤桥","aliases":[],"status":"规划中","short":"白鹤桥目前在资料中标注为规划中项目，不应作为已开放景点向游客推荐。","standard":"白鹤桥目前在资料中标注为规划中项目，不应作为已开放景点向游客推荐。"},"杨员外府":{"name":"杨员外府","aliases":[],"status":"现有资料收录","short":"这里是杨员外府。杨时乔（公元1531年～1609年），字宜迁，号止庵，江西广信上饶人，明代理学家、思想家、哲学家、政治家。嘉靖四十四年（公元1565年）中进士，宦海生涯四十四年，最终在吏部左侍郎任上去世，享年七十九岁。","standard":"各位游客，我们现在来到的是杨员外府。杨时乔（公元1531年～1609年），字宜迁，号止庵，江西广信上饶人，明代理学家、思想家、哲学家、政治家。嘉靖四十四年（公元1565年）中进士，宦海生涯四十四年，最终在吏部左侍郎任上去世，享年七十九岁。万历下诏追封杨时乔为吏部尚书，谥号端洁，并题写“恩荣”匾额以示嘉奖。崇祯十一年（公元1638年），杨时乔后人为了躲避战乱，迁来望仙谷。"},"杨府戏台":{"name":"杨府戏台","aliases":[],"status":"现有资料收录","short":"这里是杨府戏台。杨府戏台，占地约1.4亩，始建于清代顺治三年（公元1646年）。距今已逾三百八十年，其间历经多次修缮，仍完好如初。","standard":"各位游客，我们现在来到的是杨府戏台。杨府戏台，占地约1.4亩，始建于清代顺治三年（公元1646年）。距今已逾三百八十年，其间历经多次修缮，仍完好如初。戏台前檐为高起式歇山三楼式牌楼，称五凤楼，翘角高约六尺，形若朱雀展翅，亦称“燕翅楼”。这种形制来源于汉代，西晋到南宋时期，北方的名门望族衣冠南渡来到江西和福建等地，也把中原流行的建筑形式“五凤楼”带了过来。"},"云集书院":{"name":"云集书院","aliases":[],"status":"现有资料收录","short":"这里是云集书院。清乾隆四十六年（公元1781年），杨家与胡家联姻，为鼓励本地学子向学，也为延续华夏文脉，两位新人拿出成婚礼钱筹建了云集书院，校名取“贤士才俊如云汇聚”之意。这座书院距今已有二百余年历史，后几经风雨侵蚀最终荒废。","standard":"各位游客，我们现在来到的是云集书院。清乾隆四十六年（公元1781年），杨家与胡家联姻，为鼓励本地学子向学，也为延续华夏文脉，两位新人拿出成婚礼钱筹建了云集书院，校名取“贤士才俊如云汇聚”之意。这座书院距今已有二百余年历史，后几经风雨侵蚀最终荒废。如今的云集书院经翻新修葺，外部以夯土墙作为围护结构，配五叠式马头硬山墙。书院面阔五丈、进深十一丈，五叠马头最高处约四丈，总占地420平方米，门前开敞的院落面积约80平方米。"},"杨家食府":{"name":"杨家食府","aliases":[],"status":"现有资料收录","short":"这里是杨家食府。明万历三十七年（1609年），吏部侍郎杨时乔在任上去世。其后人迁居望仙村后以经营酒楼为主业，用杨家秘传古法制出滑嫩醇香的手工豆腐与风味独特的酱萝卜，深受当地百姓和往来商旅喜爱。","standard":"各位游客，我们现在来到的是杨家食府。明万历三十七年（1609年），吏部侍郎杨时乔在任上去世。其后人迁居望仙村后以经营酒楼为主业，用杨家秘传古法制出滑嫩醇香的手工豆腐与风味独特的酱萝卜，深受当地百姓和往来商旅喜爱。建筑融合了赣东北民居的特色，主路建筑山墙面均设五叠封火墙，寓意“五岳朝天”。内部由三路轴线组成小建筑群，每路均有一个天井，形成四水归堂格局，寓意财运连绵，生生不息。在当地故事中，2018年，望仙人于岩铺重新修建杨家食府。"},"若谷街":{"name":"若谷街","aliases":[],"status":"现有资料收录","short":"这里是若谷街。若谷街路段东起朔望牌坊，西接雷打石。整街由二十一栋民居组成，地势西高东低，南高北低，东西长六十九丈，高差五丈八尺。","standard":"各位游客，我们现在来到的是若谷街。若谷街路段东起朔望牌坊，西接雷打石。整街由二十一栋民居组成，地势西高东低，南高北低，东西长六十九丈，高差五丈八尺。牌坊上“若谷”二字取“虚怀若谷”之意，教化后代要处世虚心，为人大度。从朔望牌坊由东往西上行，经过长十二丈的灯笼街，南面沿街依次排布着杨家食府、霓裳阁、裕泰庄、万三书舍，尽头便是雷打石；北侧是仙谷面馆、横风葛粉铺、饺子铺、糕点铺、中草药香囊铺、饰品铺、糖水铺、果汁铺等等传统商铺，有吃有玩，业态丰富。"},"百味街":{"name":"百味街","aliases":[],"status":"现有资料收录","short":"这里是百味街。明清时期，经由鄱阳湖而来的外地客商络绎不绝。他们在此地采买货物时，常常需要停留数日，由此催生了客栈、小吃摊铺等专为客商服务的行当。","standard":"各位游客，我们现在来到的是百味街。明清时期，经由鄱阳湖而来的外地客商络绎不绝。他们在此地采买货物时，常常需要停留数日，由此催生了客栈、小吃摊铺等专为客商服务的行当。后来，随着集市日益繁华，前来赶集的村民也需要在外解决一日两餐，或是携全家前来聚餐，小吃摊便随之越开越多，渐渐形成了如同作坊铺一般的前店后院格局。待初具规模后，这里便有了“百味街”的名号。"},"灵光街":{"name":"灵光街","aliases":[],"status":"现有资料收录","short":"这里是灵光街。灵光街与岩铺广场相邻，与作坊街同样是过去墟集的一部分，主要供散户在此交易。如今那些拉着木车，赶着牛马猪羊的散户已经变成精致的各色店铺，岩铺邮所也成了邮局，但昔日人来人往的繁华盛景丝毫不减。","standard":"各位游客，我们现在来到的是灵光街。灵光街与岩铺广场相邻，与作坊街同样是过去墟集的一部分，主要供散户在此交易。如今那些拉着木车，赶着牛马猪羊的散户已经变成精致的各色店铺，岩铺邮所也成了邮局，但昔日人来人往的繁华盛景丝毫不减。街道宽约一丈五尺，总长约十五丈，由六栋二或三层的悬山式民居组成的店铺建筑群，基本遵循下店上宅的格局。其中最大的一栋建筑是这座岩铺茶馆，占地三百平方米，高约四丈，砖石结合的“口”字形四合院天井式宅院，门前宅院供卖茶之用，其中有L形廊亭，亭内供煮茶之用，亭下部悬山上部歇山，造型奇特，层次丰富；院门围墙有宋式遗风。"},"作坊街":{"name":"作坊街","aliases":[],"status":"现有资料收录","short":"这里是作坊街。在历史上，岩铺广场是墟集的入口，作坊街便是墟集商业核心部位之一：工匠和店铺云集之处。整条街道东西走向，总长约五十五丈，是由十二栋一到二层民居组成的非物质文化传承的家庭作坊式店铺建筑群。","standard":"各位游客，我们现在来到的是作坊街。在历史上，岩铺广场是墟集的入口，作坊街便是墟集商业核心部位之一：工匠和店铺云集之处。整条街道东西走向，总长约五十五丈，是由十二栋一到二层民居组成的非物质文化传承的家庭作坊式店铺建筑群。街道宽约两丈，两旁建筑高约三至四丈，基本是短边临街，向纵深方向发展。临街做店面，后面的房间做仓储或住房，即“前店后宅”。"},"鸣蝉巷":{"name":"鸣蝉巷","aliases":[],"status":"现有资料收录","short":"这里是鸣蝉巷。鸣蝉巷位于雷打石西侧，与长空桥和峡谷沿岸民居围合成梯形院落。建筑群占地约1200平方米，东西约二十丈，南北约九丈；街巷呈东西走向，地势东高西低，高差两丈，形成三级台地格局，净宽不足两丈。","standard":"各位游客，我们现在来到的是鸣蝉巷。鸣蝉巷位于雷打石西侧，与长空桥和峡谷沿岸民居围合成梯形院落。建筑群占地约1200平方米，东西约二十丈，南北约九丈；街巷呈东西走向，地势东高西低，高差两丈，形成三级台地格局，净宽不足两丈。总建筑面积1144平方米，十栋大小不一的民居沿街巷南北对称布置。所有民居基本都是下店上宅的两层传统木结构街巷民居，其中一栋为三叠马头封火墙式硬山建筑，入口为高大的“商”字型墙门，左右各设小天井，院墙高深。"},"鸣蝉广场":{"name":"鸣蝉广场","aliases":[],"status":"现有资料收录","short":"这里是鸣蝉广场。鸣蝉广场坐落于鸣蝉巷尾，与长空桥相连，并由沿溪而建的吊脚楼店铺环抱，形成一个独特的梯形庭院。其占地面积约240平方米，长度在五丈到八丈之间变化，宽度则稳定在五丈左右，布局紧凑而富有层次。","standard":"各位游客，我们现在来到的是鸣蝉广场。鸣蝉广场坐落于鸣蝉巷尾，与长空桥相连，并由沿溪而建的吊脚楼店铺环抱，形成一个独特的梯形庭院。其占地面积约240平方米，长度在五丈到八丈之间变化，宽度则稳定在五丈左右，布局紧凑而富有层次。广场四周面向庭院开设的商铺各具特色：有的是一到两层的木结构店铺，雕梁画栋，彰显传统工艺；有的是单层夯土民居，古朴坚实，透着乡土气息；还有的是下店上宅的石头房或夯土房，结构巧妙，即使墙体倾斜，屋顶仍屹立不倒，体现了民间智慧。这些建筑形式多样，造型丰富，共同勾勒出一幅生动的市井画卷。"},"醉仙街":{"name":"醉仙街","aliases":[],"status":"现有资料收录","short":"这里是醉仙街。明清时期，望仙谷作坊林立，商铺云集，常有行商脚夫赶至村内时已是入夜。为了给又饥又渴的客人们提供夜间餐食，又不打扰村中百姓安居，一些酒肆食铺便在望仙北岸做起了夜间营生。","standard":"各位游客，我们现在来到的是醉仙街。明清时期，望仙谷作坊林立，商铺云集，常有行商脚夫赶至村内时已是入夜。为了给又饥又渴的客人们提供夜间餐食，又不打扰村中百姓安居，一些酒肆食铺便在望仙北岸做起了夜间营生。山里夜间十分寒冷，凡是入店客人都必会先点上半斤热酒驱寒。门窗紧闭的小屋内，红炉煮酒，酒香弥漫，待到白天开窗时，对岸的人便会闻到一缕缕神秘的酒香自山中飘来。在当地故事中，村民皆以为有仙人在对面山中酿酒，因此这条街道得名“醉仙街”。"},"仰仙村":{"name":"仰仙村","aliases":[],"status":"现有资料收录","short":"这里是仰仙村。望仙谷位于赣、浙、皖三省交界处，是古时候逃避战乱的必经之地。元末明初，一支从浙江青田迁出的畲族部众辗转远迁而来，见此处没有官兵管辖，便留在了望仙谷内。","standard":"各位游客，我们现在来到的是仰仙村。望仙谷位于赣、浙、皖三省交界处，是古时候逃避战乱的必经之地。元末明初，一支从浙江青田迁出的畲族部众辗转远迁而来，见此处没有官兵管辖，便留在了望仙谷内。但身在异乡为异客，为了护卫族群不被侵扰，畲族人在山中修建土楼堡寨。后来此处陆续有难民投奔而来，畲族人倾力相助，建造屋舍，逐渐形成村落。"},"山神庙":{"name":"山神庙","aliases":[],"status":"现有资料收录","short":"这里是山神庙。聚贤楼对面伫立着一座古老的灵山山神庙，二者相隔一条宽约两丈、长约三十九丈的街市。庙门两侧挂有一幅对联，上联为：“佛在灵山莫远求，灵山只在汝心头”；下联为：“人人有个灵山塔，都在灵山塔下修”。","standard":"各位游客，我们现在来到的是山神庙。聚贤楼对面伫立着一座古老的灵山山神庙，二者相隔一条宽约两丈、长约三十九丈的街市。庙门两侧挂有一幅对联，上联为：“佛在灵山莫远求，灵山只在汝心头”；下联为：“人人有个灵山塔，都在灵山塔下修”。上下联合起来正是佛家偈语，寥寥数语便点透了修行做人的哲理，将深奥的法门坦然展示给世人。族长为求族人获得安定生活，在灵山内一座山神神龛前发愿：若得神灵庇佑，觅得安家之处，便为山神塑像修庙，世代供奉。在当地故事中，在这座小庙背后，是关于畲族的传说。"},"百舸桥":{"name":"百舸桥","aliases":[],"status":"现有资料收录","short":"这里是百舸桥。咸丰年间，望仙暴雨成患，当地人遂修建浮桥一座：桥面以木板铺就，桥身下以浮船承托，当地人称之为船桥。咸丰九年（公元1859年）六月，暴雨连下三日三夜，船桥被毁。","standard":"各位游客，我们现在来到的是百舸桥。咸丰年间，望仙暴雨成患，当地人遂修建浮桥一座：桥面以木板铺就，桥身下以浮船承托，当地人称之为船桥。咸丰九年（公元1859年）六月，暴雨连下三日三夜，船桥被毁。广信知府沈葆桢派人赈济，随后在原址修建廊桥一座，更名为“百舸桥”。重建后的百舸桥位于百味街尾部，连接杨府戏台与醉仙街，属三跨石墩木梁式人行廊桥，占地一百一十平方米，长十丈，宽约一丈五尺；设有两个由花岗岩叠砌而成的桥墩，形成三个桥洞。"},"青云桥":{"name":"青云桥","aliases":[],"status":"现有资料收录","short":"这里是青云桥。青云桥位于饶北河与双坑溪的汇合处，东接游客中心，西连野营地，是入园的必经之路。临行前，杨家族长在宗祠发下宏愿，若诸子弟榜上有名，便重修村口已经破损的旧桥，让村中百姓出行无忧。","standard":"各位游客，我们现在来到的是青云桥。青云桥位于饶北河与双坑溪的汇合处，东接游客中心，西连野营地，是入园的必经之路。临行前，杨家族长在宗祠发下宏愿，若诸子弟榜上有名，便重修村口已经破损的旧桥，让村中百姓出行无忧。后来，杨家三子竟然全部考中秀才，成功进入士大夫阶层，享有诸多特权。杨家当即捐重资修桥，取名“青云桥”，寄望族中子弟都能平步青云，步步高升，光宗耀祖。相传明景泰年间，九牛村杨氏家族中有三人赴饶州府考取秀才。"},"四通桥":{"name":"四通桥","aliases":[],"status":"现有资料收录","short":"这里是四通桥。明嘉靖年间，望仙谷胡、杨、刘、祝四家族共同捐资修建石桥一座，南联望仙，北至樟涧水，西达岩铺，东接饲马古道，四通八达，遂命名为四通桥。此桥据史考重修，如今的四通桥位于白鹤崖东面，东西横跨望仙河峡谷，连接着通向游客中心的四通栈道。","standard":"各位游客，我们现在来到的是四通桥。明嘉靖年间，望仙谷胡、杨、刘、祝四家族共同捐资修建石桥一座，南联望仙，北至樟涧水，西达岩铺，东接饲马古道，四通八达，遂命名为四通桥。此桥据史考重修，如今的四通桥位于白鹤崖东面，东西横跨望仙河峡谷，连接着通向游客中心的四通栈道。整桥为三跨石墩石梁人行桥，通体以本地花岗岩建造，占地136平方米，长十二丈，宽一丈三尺。四个桥墩皆精选自周边山脉中质地坚硬、色泽沉稳的花岗岩，单个桥墩长两丈五尺，宽约一丈，高约两丈，中间两个桥墩迎上流做金刚分水，顶部压顶石微微翘起，俗称“燕嘴”，巧妙分流河水，确保了桥梁结构的稳固与安全。"},"雷木桥":{"name":"雷木桥","aliases":[],"status":"现有资料收录","short":"这里是雷木桥。唐元和十一年（公元816年），江西境内暴雨连绵，江州爆发大水，望仙谷也遭受波及。百姓纷纷登上白鹤崖避难，等到洪水退去，却发现原本通往村子的桥已被洪水冲毁。","standard":"各位游客，我们现在来到的是雷木桥。唐元和十一年（公元816年），江西境内暴雨连绵，江州爆发大水，望仙谷也遭受波及。百姓纷纷登上白鹤崖避难，等到洪水退去，却发现原本通往村子的桥已被洪水冲毁。正当人们束手无策之时，突然乌云压阵，电闪雷鸣。雷光之中，有人隐约看见山间有桥，便领着众人朝着雷光所指的方向寻去。"},"三口锅":{"name":"三口锅","aliases":[],"status":"现有资料收录","short":"这里是三口锅。望仙峡谷的岩壁层叠堆积与倒石地貌，可追溯至一亿四千万年前的侏罗纪晚期至白垩纪早期。此处三口深潭位于饶北河流经白鹤崖谷底的河段，承接观音瀑冲击下来的水流，区域长约二十七丈，宽约八丈，属侵蚀-剥蚀型花岗岩峡谷地貌，是河道经亿万年流水冲刷，发育壶穴而成。","standard":"各位游客，我们现在来到的是三口锅。望仙峡谷的岩壁层叠堆积与倒石地貌，可追溯至一亿四千万年前的侏罗纪晚期至白垩纪早期。此处三口深潭位于饶北河流经白鹤崖谷底的河段，承接观音瀑冲击下来的水流，区域长约二十七丈，宽约八丈，属侵蚀-剥蚀型花岗岩峡谷地貌，是河道经亿万年流水冲刷，发育壶穴而成。三口锅深度不详，民间有“三两花线打不到底”的说法，意思是三两重的绣花线连起来的长度，都探不到潭底的深度。元末时期，朱元璋与陈友谅会战于鄱阳湖，粮船不慎在交战时倾覆。在当地故事中，这三口水潭还有一个神奇的传说。"},"三清瀑":{"name":"三清瀑","aliases":[],"status":"现有资料收录","short":"这里是三清瀑。悬于崖壁之上的瀑布瀑面宽两丈，高差二十二丈，水流从海拔257米的九牛引水渠涌出，沿茂林掩映的岩壁层层跌落，穿过寻仙栈道石桥，经十三级叠水汇入饶北河。三清瀑一脉分三支，常年滋润着崖壁上的各类植物，加之水流柔缓，也是许多鸟类取水的地方，生动体现出“道生一，一生二，二生三，三生万物”的道家哲理。","standard":"各位游客，我们现在来到的是三清瀑。悬于崖壁之上的瀑布瀑面宽两丈，高差二十二丈，水流从海拔257米的九牛引水渠涌出，沿茂林掩映的岩壁层层跌落，穿过寻仙栈道石桥，经十三级叠水汇入饶北河。三清瀑一脉分三支，常年滋润着崖壁上的各类植物，加之水流柔缓，也是许多鸟类取水的地方，生动体现出“道生一，一生二，二生三，三生万物”的道家哲理。三条分流最终又一同汇入溪谷，日日夜夜奔流不息，象征着阴阳五行中所说的“周而复始，生生不息”，这正是生命能量的体现。"},"观音瀑":{"name":"观音瀑","aliases":[],"status":"现有资料收录","short":"这里是观音瀑。观音瀑位于饶北河峡谷最窄的一段，依托三口锅深潭的北侧崖壁。瀑面宽六丈，高差二十九丈，从海拔257米的九牛引水渠山体拐角处沿花岗岩崖壁倾泻而下，与近乎垂壁的白鹤崖岩体形成深切的“V”字形。","standard":"各位游客，我们现在来到的是观音瀑。观音瀑位于饶北河峡谷最窄的一段，依托三口锅深潭的北侧崖壁。瀑面宽六丈，高差二十九丈，从海拔257米的九牛引水渠山体拐角处沿花岗岩崖壁倾泻而下，与近乎垂壁的白鹤崖岩体形成深切的“V”字形。每逢雨后，水量丰沛之时，瀑布的整面石壁被奔涌水流尽数覆盖，水幕沿岩壁层层跌落，激起的白浪如素纱垂落、翻涌，巍峨石壁被白玉般的素纱轻裹，恰与观音娘娘头戴白纱，“慈心济世”的形象隔空呼应。而峡谷南侧圆顶峰之上，正好矗立着供奉千手观音的天心寺，当白日无云，阳光正好时，站在寺庙前眺望，便能见到瀑布顶端与光线晕出佛像“圆光”，恰似观音低眉，默佑一方。"},"彩虹瀑":{"name":"彩虹瀑","aliases":[],"status":"现有资料收录","short":"这里是彩虹瀑。平日里难得一见的彩虹，在望仙谷却藏有一处“常驻观赏地”。只要天气晴朗，便有机会在此地遇到属于你的彩虹。","standard":"各位游客，我们现在来到的是彩虹瀑。平日里难得一见的彩虹，在望仙谷却藏有一处“常驻观赏地”。只要天气晴朗，便有机会在此地遇到属于你的彩虹。且因“晴日见虹”的景致，这条瀑布有一个独特的名字——彩虹瀑。彩虹瀑位于寻仙路的尾端，西接醉仙街，与朝鹤楼隔谷相望。"},"岩花瀑":{"name":"岩花瀑","aliases":[],"status":"现有资料收录","short":"这里是岩花瀑。岩花瀑位于醉仙街的东部起始段，瀑面上下宽窄不定，约在二至四丈之间，高差十九丈，自海拔257米的九牛引水渠涌出，在乱石堆上层层跌落，流经寻仙栈道后汇入饶北河。九十年代末，这里曾是采石场开采花岗岩的核心矿区，山体遭到严重破坏，巨大的碎石堆积在路边。","standard":"各位游客，我们现在来到的是岩花瀑。岩花瀑位于醉仙街的东部起始段，瀑面上下宽窄不定，约在二至四丈之间，高差十九丈，自海拔257米的九牛引水渠涌出，在乱石堆上层层跌落，流经寻仙栈道后汇入饶北河。九十年代末，这里曾是采石场开采花岗岩的核心矿区，山体遭到严重破坏，巨大的碎石堆积在路边。经过生态修复后，曾经满目疮痍的矿坑变为如今雅致的青山绿水，瀑布拍打在旧日的碎石堆上，砸出朵朵浪花，犹如石上生花，因此得名岩花瀑。"},"喜乐桥":{"name":"喜乐桥","aliases":[],"status":"现有资料收录","short":"这里是喜乐桥。喜乐桥，始建于唐代（公元730年），为金氏与望仙百姓合力所修。因年久失修，原来的喜乐桥早已损毁，如今的喜乐桥是明清时期在原址上重建。","standard":"各位游客，我们现在来到的是喜乐桥。喜乐桥，始建于唐代（公元730年），为金氏与望仙百姓合力所修。因年久失修，原来的喜乐桥早已损毁，如今的喜乐桥是明清时期在原址上重建。桥建成之初，为求今后少有天灾，各家各户自发在护栏系上红布，寄兆“平安无虞”，也因此定下“喜乐”之名。后有外地客商、行人经过，见此桥系满红布，误以为祈愿之地，也跟着系上红布。"},"醉仙桥":{"name":"醉仙桥","aliases":[],"status":"现有资料收录","short":"这里是醉仙桥。醉仙桥全长十六丈，宽七尺，桥面离河谷二丈六尺。因年代过久，屡经修补，现存的醉仙桥为钢筋混凝土多跨人行梁桥，两侧设栗木护栏。","standard":"各位游客，我们现在来到的是醉仙桥。醉仙桥全长十六丈，宽七尺，桥面离河谷二丈六尺。因年代过久，屡经修补，现存的醉仙桥为钢筋混凝土多跨人行梁桥，两侧设栗木护栏。整桥南接迷津口河谷平台，北接醉仙街密林。桥身以平桥为主，平面呈“之”字形，架设于饶北河河谷之上。在当地故事中，往来望仙的客商在醉仙街听闻酒仙赐福之事后，便效仿喜乐桥的祈愿举动，在醉仙桥扶手上挂上象征祈愿的红布条，向传说中的酒仙虔心祈求行舟平安、生意顺遂。"},"长空桥":{"name":"长空桥","aliases":[],"status":"现有资料收录","short":"这里是长空桥。长空桥始建于明朝洪武年间，至今已有六百余年历史。在望仙所有古桥中，长空桥最具特点，它的建造与修缮前后竟历时二百六十余年，桥墩建于明代，桥身却建于清代。","standard":"各位游客，我们现在来到的是长空桥。长空桥始建于明朝洪武年间，至今已有六百余年历史。在望仙所有古桥中，长空桥最具特点，它的建造与修缮前后竟历时二百六十余年，桥墩建于明代，桥身却建于清代。这全因百余年间数次水患，几度冲毁桥梁，望仙百姓历经艰辛坎坷，最终跨越朝代才修建完毕。如今的长空桥占地一百四十三平方米，长十二丈，宽一丈六尺，平面呈“L”型，为五跨梁桥结构，桥上架有十二间两坡抬梁式木结构廊桥，跨越宽九丈的峡谷，连接北面长空栈道和南面鸣蝉巷。"},"祝满楼":{"name":"祝满楼","aliases":[],"status":"现有资料收录","short":"这里是祝满楼。元延祐年间，为躲避蔡五九之乱，著名赋论家祝尧携家眷迁居望仙，成为望仙祝氏的始祖。延祐五年（公元1318年），祝尧进士及第，为官期间兴学校、课农桑、清狱讼、革奸回，吏畏民怀，号称良吏。","standard":"各位游客，我们现在来到的是祝满楼。元延祐年间，为躲避蔡五九之乱，著名赋论家祝尧携家眷迁居望仙，成为望仙祝氏的始祖。延祐五年（公元1318年），祝尧进士及第，为官期间兴学校、课农桑、清狱讼、革奸回，吏畏民怀，号称良吏。他晚年主要所著的《古赋辨体》，是中国古代辨体理论批评发展史上最具理论体系的文体学巨著。祝氏后人为纪念先祖，遂建祝满楼。"},"迷津口":{"name":"迷津口","aliases":[],"status":"现有资料收录","short":"这里是迷津口。迷津口现存五栋大小不一的民居、三个廊亭、一座喜乐桥。整个小山窝位于白鹤崖的西侧，福家小院的东面，是一个宽约八丈，高差约十丈的原生三岔口，有发源于圆顶峰的小溪流经岩铺村，穿过此处流向饶北河。","standard":"各位游客，我们现在来到的是迷津口。迷津口现存五栋大小不一的民居、三个廊亭、一座喜乐桥。整个小山窝位于白鹤崖的西侧，福家小院的东面，是一个宽约八丈，高差约十丈的原生三岔口，有发源于圆顶峰的小溪流经岩铺村，穿过此处流向饶北河。迷津口交通交错复杂，向西可前往百味街，向上可登临朝鹤楼，穿越玻璃栈道；前往岩铺村、仰仙村；去往三神庙、胡氏宗祠。而“迷津口”三字也出自“雾失楼台，月迷津渡”，此句为宋代诗人秦观所作，有此处极易迷失方向之意，人生也多有迷津，但只要通过了迷津口，定能寻到属于自己的桃源。"},"百花园":{"name":"百花园","aliases":[],"status":"现有资料收录","short":"这里是百花园。百花园位于杨员外府北山墙与饶北河沿河连廊之间，小院占地约220平方米，长约十四丈，宽约一丈六尺至三丈六尺不等。园中有宽四尺的青石板铺就的“S”形穿行步道，步道顶部为长约十丈五尺的竹制廊架，架子上悬挂着飘逸的纱幔，随风舞动。","standard":"各位游客，我们现在来到的是百花园。百花园位于杨员外府北山墙与饶北河沿河连廊之间，小院占地约220平方米，长约十四丈，宽约一丈六尺至三丈六尺不等。园中有宽四尺的青石板铺就的“S”形穿行步道，步道顶部为长约十丈五尺的竹制廊架，架子上悬挂着飘逸的纱幔，随风舞动。四季花卉在此各展芳华：春季牡丹、杜鹃、木香、百合春花争艳；夏季绣球、大花萱草、麻叶泽兰叶衬花娇；秋季黄菊、月季繁花似锦；冬季茶梅傲霜怒放。每逢院内百花盛开，正是“百般红紫斗芳菲”的动人景致。"},"仙有伙房":{"name":"仙有伙房","aliases":[],"status":"现有资料收录","short":"这里是仙有伙房。仙有伙房占地约230平方米，长八丈，宽约三丈，高约四丈，位于岩铺村核心区域，北侧有小庭院下通迷津口，是一座坐东朝西的“L”形酒肆店铺建筑，与门前的健身房、卫生间围合成倒“C”字形庭院，院落中设有一方长方形泳池。屋顶采用曲面悬山样式，山墙出檐四尺，檐口之下的外墙做仿夯土设计，檐口之上的山墙模仿穿斗式木结构，柱间板壁以白灰做饰面。","standard":"各位游客，我们现在来到的是仙有伙房。仙有伙房占地约230平方米，长八丈，宽约三丈，高约四丈，位于岩铺村核心区域，北侧有小庭院下通迷津口，是一座坐东朝西的“L”形酒肆店铺建筑，与门前的健身房、卫生间围合成倒“C”字形庭院，院落中设有一方长方形泳池。屋顶采用曲面悬山样式，山墙出檐四尺，檐口之下的外墙做仿夯土设计，檐口之上的山墙模仿穿斗式木结构，柱间板壁以白灰做饰面。建筑长边设为五开间，左侧次间做抱厦作为出入口，山墙外观为十檩前廊尖山式屋架。短边为后厨空间，一层向外伸出批檐，以此扩充使用空间。"},"雷打石":{"name":"雷打石","aliases":[],"status":"现有资料收录","short":"这里是雷打石。雷打石位于若谷街与鸣蝉巷交汇处，万三书舍的西侧，为一块主体基岩为燕山晚期早白垩世中粗粒黑云母碱长花岗岩的巨石。现存长约五丈，宽约二丈八尺，高约二丈二尺。","standard":"各位游客，我们现在来到的是雷打石。雷打石位于若谷街与鸣蝉巷交汇处，万三书舍的西侧，为一块主体基岩为燕山晚期早白垩世中粗粒黑云母碱长花岗岩的巨石。现存长约五丈，宽约二丈八尺，高约二丈二尺。一眼望去两侧劈裂痕迹明显，断面形式似刀劈斧凿，另两侧花岗岩侵蚀-剥蚀构造特征突出。石上立一座六角亭，造型挺拔精巧。"},"寻仙路":{"name":"寻仙路","aliases":[],"status":"现有资料收录","short":"这里是寻仙路。过了青云桥，再踏寻仙路，从此鸿运当头。寻仙路东起青云桥，西接醉仙街，总长一百二十丈，宽约一丈不等，首尾高差约十一丈，台阶209步。","standard":"各位游客，我们现在来到的是寻仙路。过了青云桥，再踏寻仙路，从此鸿运当头。寻仙路东起青云桥，西接醉仙街，总长一百二十丈，宽约一丈不等，首尾高差约十一丈，台阶209步。沿途依次经过望仙在野营地、三叠水、三清瀑、三口锅、观音瀑、彩虹瀑等奇观。寻仙路前半段山麓稍缓，路面以人工开凿，挖填互补、夯土筑基，花岗岩铺砌为主。"},"三叠水":{"name":"三叠水","aliases":[],"status":"现有资料收录","short":"这里是三叠水。三叠水与三清瀑相对而立，占地约3200平方米，高差三丈有余。此地属侵蚀-剥蚀型花岗岩峡谷地貌，由亿万年流水冲刷河道发育成高低有序、错落有致的独特地势。","standard":"各位游客，我们现在来到的是三叠水。三叠水与三清瀑相对而立，占地约3200平方米，高差三丈有余。此地属侵蚀-剥蚀型花岗岩峡谷地貌，由亿万年流水冲刷河道发育成高低有序、错落有致的独特地势。两条各自发源于南高峰的望仙水与西高峰的方村溪在此汇合，自上而下经过石阶，顺势流入各级水潭，恰巧形成水量相异、水声清越的三层“叠水迎宾”之势。一如古琴曲《阳关三叠》，一波三叹，故称“三叠水”。"},"墨池":{"name":"墨池","aliases":[],"status":"现有资料收录","short":"这里是墨池。嘉靖三十九年（公元1560年），为纪念万三刚简公的德行功绩，胡氏家族出资兴建万三书舍，作为族中子弟及乡邻求学修身的场所。距离书舍百米外有一处天然山泉眼，泉水自石缝中涌出，清澈甘冽，常年涓流不断，不仅为书舍提供了水源，也成了学子们课余常去之地。","standard":"各位游客，我们现在来到的是墨池。嘉靖三十九年（公元1560年），为纪念万三刚简公的德行功绩，胡氏家族出资兴建万三书舍，作为族中子弟及乡邻求学修身的场所。距离书舍百米外有一处天然山泉眼，泉水自石缝中涌出，清澈甘冽，常年涓流不断，不仅为书舍提供了水源，也成了学子们课余常去之地。某日，有书舍学子见泉水流淌四散，便灵机一动，将一方废弃的磨盘移至泉眼下方，承接水流，形成一处既可供蓄水又能摆放器具的石台。自此，学子们纷纷来此取水烹茶、研墨习字、洗涤笔砚。"},"川流不息廊桥":{"name":"川流不息廊桥","aliases":[],"status":"现有资料收录","short":"这里是川流不息廊桥。这座沿河而建的建筑名为川流不息廊桥，是典型的江西风雨廊桥形制，历史悠久，展现了传统木构建筑的精湛技艺。廊桥全长二十二丈，宽约一丈，共分为十五间，采用十六榀五檩尖山式木屋架结构，整体稳固而协调。","standard":"各位游客，我们现在来到的是川流不息廊桥。这座沿河而建的建筑名为川流不息廊桥，是典型的江西风雨廊桥形制，历史悠久，展现了传统木构建筑的精湛技艺。廊桥全长二十二丈，宽约一丈，共分为十五间，采用十六榀五檩尖山式木屋架结构，整体稳固而协调。在第四、八、十二间位置，屋面特意高出两侧，做成悬山结构，不仅利于排水，还增添了层次感。所有山面出檐设计为四椽四档，覆盖着小青瓦屋面，瓦片排列整齐，历经风雨仍显古朴韵味。"}};

      var actionButton = layer.querySelector('[data-ticket-next]');
      var ticketCart = {};
      var cartSummary = document.createElement('div');
      cartSummary.className = 'ticket-cart-summary';
      actionButton.parentNode.insertBefore(cartSummary,actionButton);
      function renderTicketCart(){
        var count = 0;
        var total = 0;
        Object.keys(ticketCart).forEach(function(key){count += ticketCart[key].quantity;total += ticketCart[key].quantity * ticketCart[key].unitPrice;});
        cartSummary.innerHTML = '<span>已选 <b>' + count + '</b> 份</span><span>合计 <b>¥' + total + '</b></span>';
        actionButton.textContent = '填写游客信息';
        actionButton.disabled = count === 0;
      }
      Array.prototype.forEach.call(layer.querySelectorAll('input[name="ticket-type"]'),function(input){
        var label = input.parentNode;
        input.checked = false;
        input.disabled = true;
        if (/免票/.test(input.value)) {
          var freeButton = document.createElement('button');
          freeButton.type = 'button';
          freeButton.className = 'free-help-btn';
          freeButton.textContent = '查看免票核验方式';
          freeButton.addEventListener('click',function(e){e.preventDefault();closeSheet();addMessage('<strong>免票人员不用加入线上订单。</strong><br>请带好相关证件，到景区门口游客中心票窗核验并换取纸质票。','ai');});
          label.appendChild(freeButton);
          return;
        }
        label.classList.add('quantity-card');
        var unitPrice = ticketProductAmount(input.value);
        ticketCart[input.value] = {value:input.value,name:ticketProductName(input.value),unitPrice:unitPrice,quantity:/^成人(?:门)?票/.test(input.value)?1:0};
        var controls = document.createElement('div');
        controls.className = 'ticket-qty';
        controls.innerHTML = '<button class="qty-btn" type="button" data-qty-change="-1" aria-label="减少数量">−</button><span class="qty-value">' + ticketCart[input.value].quantity + '</span><button class="qty-btn" type="button" data-qty-change="1" aria-label="增加数量">＋</button>';
        label.appendChild(controls);
        function updateCard(){var item=ticketCart[input.value];controls.querySelector('.qty-value').textContent=item.quantity;label.classList.toggle('selected',item.quantity>0);renderTicketCart();}
        Array.prototype.forEach.call(controls.querySelectorAll('[data-qty-change]'),function(button){button.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var item=ticketCart[input.value];item.quantity=Math.max(0,Math.min(20,item.quantity+parseInt(button.getAttribute('data-qty-change'),10)));updateCard();});});
        updateCard();
      });
      Array.prototype.forEach.call(layer.querySelectorAll('[data-ticket-tab]'),function(tab){tab.addEventListener('click',function(){
        Array.prototype.forEach.call(layer.querySelectorAll('[data-ticket-tab]'),function(item){var active=item===tab;item.classList.toggle('active',active);item.setAttribute('aria-selected',active?'true':'false');});
        Array.prototype.forEach.call(layer.querySelectorAll('[data-ticket-panel]'),function(panel){panel.hidden=panel.getAttribute('data-ticket-panel')!==tab.getAttribute('data-ticket-tab');});
      });});
      actionButton.addEventListener('click',function(){
        var date = layer.querySelector('#ticket-date').value;
        var items = Object.keys(ticketCart).map(function(key){return ticketCart[key];}).filter(function(item){return item.quantity>0;});
        if (!items.length) return;
        closeSheet();
        openVisitorInformation(date,items);
      });
      renderTicketCart();
    }

    function normalizeTicketItems(selection) {
      if (Array.isArray(selection)) return selection;
      return [{value:String(selection),name:ticketProductName(selection),unitPrice:ticketProductAmount(selection),quantity:1}];
    }

    function ticketItemsCount(items) {
      return items.reduce(function(sum,item){return sum + item.quantity;},0);
    }

    function ticketItemsTotal(items) {
      return items.reduce(function(sum,item){return sum + item.quantity * item.unitPrice;},0);
    }

    function ticketOrderLinesHTML(items) {
      return items.map(function(item){return '<div class="order-product-line"><span><b>' + item.name + '</b><small>¥' + item.unitPrice + ' × ' + item.quantity + '</small></span><b>¥' + (item.unitPrice * item.quantity) + '</b></div>';}).join('');
    }

    function ticketProductAmount(ticketType) {
      var matched = String(ticketType || '').match(/¥(\d+)/);
      return matched ? parseInt(matched[1],10) : 0;
    }

    function ticketProductName(ticketType) {
      var name = String(ticketType || '').replace(/\s*¥\d+(?:\/人)?\s*$/,'');
      return name === '成人票' ? '成人门票' : name;
    }

      if (/未满.*16|16.*陪同|儿童.*陪同|小孩.*陪同/.test(q)) return '<strong>未满16周岁的游客，需要由16周岁及以上游客陪同入园。</strong><br>带孩子出行时，请提前确认同行陪同人和每位游客的实名购票信息。';
      if (/直播|商业.*(摄影|摄像|拍摄)|采访|专业.*摄影|三脚架|反光板|滑轨|照明设备/.test(q)) return '<strong>普通游览拍照可以留念，但商业拍摄、直播、采访或使用专业摄影摄像辅助设备，需要事先取得景区书面同意。</strong><br>请不要擅自开展商业拍摄、直播或影响他人游览和景区运营的拍摄活动。';
      if (/轮椅|无障碍|导盲犬|视障/.test(q)) return '<strong>行动不便人士需要轮椅辅助通行，或视障人士需要携带导盲犬入园时，请至少提前一天预约特需服务。</strong><br>导盲犬入园需按要求准备相关证件和免疫证明；电动轮椅请在主干道或无障碍通道低速通行，并避让人流。<div class="note">景区暂不提供导盲犬寄存或看管服务，部分场所的进入安排以现场规定为准。</div>';

      if (/行李.*(服务|搬运|拿|取)|帮.*拿.*行李/.test(q)) return '<strong>可以帮住店客人安排免费行李服务。</strong><br>请准备房号、入住人姓名、行李数量和大致大小，并先把行李收拾好。高峰时段可能需要约40分钟，具体以上门时间为准。<div class="note">到民宿前台报房号即可安排，不需要在这里另外打电话。</div>';
      if (/房间.*(含|包含|送|赠).*(门票|早餐)|门票.*早餐.*房/.test(q)) return '<strong>景区内民宿的基础房型通常包含2张门票和2份早餐。</strong><br>5档及以上亲子房通常包含3张门票和3份早餐；双卧、麻将套及悬崖家庭套等房型可能包含4张门票和4份早餐。<div class="note">仙宿、悬崖民宿早餐通常在白鹤餐厅；仰仙村可能使用早餐券或在承远楼、老围楼用餐。具体权益、餐厅与份数请以所选房型订单页为准。</div>';
      if (/开发票|开票|发票/.test(q) && /(住宿|房费|酒店|民宿|客房|预付|现付)/.test(q)) return '<strong>住宿发票要看您的付款渠道。</strong><div class="grid"><div class="cell"><b>旅行社、携程、美团等预付订单</b>请联系原付款平台开具</div><div class="cell"><b>抖音、小程序、飞猪等现付订单</b>可联系民宿前台核对办理</div></div><div class="note">办理时准备入住人姓名、房号、入住日期、订单渠道和发票抬头即可。</div>';
      if (/门票.*(开发票|开票|发票)|发票.*门票/.test(q)) return '<strong>景区门票可以申请开具发票。</strong><br>请准备付款截图、发票抬头和税号；网络购票也可先在原购买平台查看开票入口。门票开票客服微信为 17379382537，服务时间为 9:00—21:00。<div class="note">涉及真实订单核验时，请以购票平台或客服确认结果为准。</div>';
      if (/几点.*(入住|退房)|入住.*几点|退房.*几点|延迟退房|晚退房/.test(q)) return '<strong>通常17:00后办理入住，次日12:00前退房。</strong><br>如果提前到店且房间已经打扫完成，前台会尽量协调提前入住；延迟退房需结合当天房态确认，通常只能尽量协调至12:30，继续延迟可能产生半天房费。<div class="note">退房后仍想游玩，可以先把行李免费寄存在民宿中心。</div>';
      if (/未成年.*(入住|开房|办理)|孩子.*单独.*住/.test(q)) return '<strong>未成年人不能独自随意办理入住。</strong><br>未满16周岁无法单独办理；年满16周岁也需要核验监护人信息及同住关系。请带好有效身份信息，具体由前台按实名登记要求办理。';
      if (/没有身份证.*入住|没带身份证.*入住|护照.*入住|电子证件.*入住|身份证照片.*入住/.test(q)) return '<strong>住宿必须实名登记。</strong><br>境内住客没带实体身份证时，可向前台出示可核验的电子证件或身份证正反面照片；外宾可使用护照。<div class="note">这是住宿登记口径，不等同于景区门票入园规则；能否完成登记以公安实名核验和前台现场办理结果为准。</div>';
      if (/借.*证件.*(开房|入住)|用.*别人.*身份证.*(开房|入住)|朋友没带身份证/.test(q)) return '<strong>不可以借用他人证件代办入住。</strong><br>每位实际入住人都需要按实名登记要求核验身份；没带证件时，请向前台确认可使用的电子证件办理方式。';
      if (/房间.*(加床|拼床)|加床|拼床/.test(q)) return '<strong>目前客房不支持加床，固定床架也不能拼床。</strong><br>家庭同行可以优先比较亲子房、复式房，或根据人数选择两间房。您告诉我成人和孩子人数、孩子年龄与每晚预算，我可以继续帮您筛选。';
      if (/阳台|落地窗|榻榻米/.test(q) && /(房|民宿|酒店|住宿)/.test(q)) return '<strong>带阳台、落地窗或榻榻米的房间数量不多，需要按实际房态筛选。</strong><br>仰仙村云阙双床和仙宿揽月大床带阳台；其他特殊配置建议在下单时备注，正式入住安排仍以可售房间为准。';
      if (/(风景|景观|朝向|视野).*(房|民宿|酒店)|房.*(风景|景观|朝向|视野)/.test(q)) return '<strong>如果很在意窗外景色，建议直接选择明确标注的景观房。</strong><br>基础1—2档房型多位于一楼或受墙体遮挡，不适合把“看景”作为核心需求；普通房型的楼栋和朝向只能尽量备注，无法保证。';
      if (/房间.*(远|距离)|离.*(前台|民宿中心).*(远|多久)|前台.*房间/.test(q)) return '<strong>不同民宿和楼栋离前台的距离差别比较大。</strong><br>仙宿部分楼栋步行约5—10分钟，主景区内的房间可能需要15—20分钟；仰仙村主要分布在民宿中心入口附近。具体楼栋通常要到入住安排后才能确认，可以提前备注希望靠近前台。';
      if (/几家.*(酒店|民宿)|有哪些.*(酒店|民宿)|酒店.*几个板块/.test(q)) return '<strong>景区住宿主要分为三个板块：</strong><br>仙宿、仰仙村民宿和悬崖民宿，均由景区统一管理。它们在位置、景观、房型和价格上各有侧重，我可以根据入住人数和预算继续帮您比较。';
      if (/(具体|全部|哪些|什么).*(房型)|房型.*(介绍|有哪些|区别)/.test(q)) return '<strong>房型可以先按三个住宿区域来理解。</strong><div class="grid"><div class="cell"><b>仙宿</b>清越、翠微、云光、太霄、家庭房、复式房、套房及景观房</div><div class="cell"><b>仰仙村</b>沧澜、皓月、漱玉、琉璃、紫霄、瑶池复式、流云套房及景观房</div><div class="cell"><b>悬崖民宿</b>崖顶或崖壁大床、亲子、复式、独栋、悬空景观及家庭套房</div></div><br>两人入住可先看基础大床或双床；两大一小更适合亲子或复式；重视景色则优先选择明确标注的景观房。<div class="note">准确面积、床型、门票早餐权益、逐晚价格和房态，请以所选日期的房源详情页为准。</div>';
      if (/(订单|预订|订房).*(成功|确认|订上)|下单.*有房|有没有订上|收到.*入住成功/.test(q)) return '<strong>订单显示“已确认”或收到“入住成功”通知，才代表客房预订成功。</strong><br>新订单通常需要一点接单时间；如果半小时后仍未确认，或提示所选房型已满，请回原预订渠道查看状态，不要重复支付。<div class="note">查询时准备订单号、入住人姓名和预订渠道，会更快找到对应订单。</div>';
      if (/(预订|订房|民宿|酒店).*(渠道|哪里订|怎么买)|官方.*(订房|民宿)/.test(q)) return '<strong>景区民宿优先在望仙谷官方小程序或公众号预订。</strong><br>也可以在携程、美团、飞猪等平台搜索“望仙谷仙宿”“望仙谷仰仙村民宿”或“望仙谷悬崖民宿”。不同渠道的房态、价格和权益可能不同，下单前请完整查看订单说明。';
      if (/多间房.*(优惠|便宜|折扣)|订.*多间.*房|订.*[一二两三四五六七八九十\d]+间房.*(优惠|便宜|折扣)/.test(q)) return '<strong>目前没有多间房专属折扣，通常仍按每间房的可售价格结算。</strong><br>多人同行时，可以把入住日期、房间数量、每间入住人数和预算告诉我，我会优先帮您比较更合适的房型组合。';
      if (/团购券.*(入园|入住|直接用)|券.*预约房/.test(q)) return '<strong>住宿团购券通常不能直接入园或入住，需要先完成房间预约。</strong><br>预约成功后，再凭有效入住订单和证件办理；客房是动态库存，建议尽早选日期，避免到场后没有对应房型。';
      if (/参观.*悬崖|悬崖民宿.*参观/.test(q)) return '<strong>悬崖民宿住宿区域暂不对非住客开放参观。</strong><br>如果想欣赏悬崖景观，可以前往朝鹤楼或悬崖图书馆等公共观景区域。';
      if (/床.*(尺寸|多大|宽)|大床.*米|双床.*米/.test(q)) return '<strong>床型会随房档和具体房型变化。</strong><div class="grid"><div class="cell"><b>1—2档</b>大床约1.8×2米；双床约2张1.2×2米</div><div class="cell"><b>3—4档复式</b>约1张1.8×2米＋1张1.2×2米</div><div class="cell"><b>5档及以上复式</b>约1张1.8米＋1张1.35米；部分双床为2张1.35×2米</div></div><div class="note">准确床型与入住人数请以具体房型详情页为准。</div>';
      if (/有电梯|电梯/.test(q) && /(景区|民宿|酒店|住宿|楼)/.test(q)) return '<strong>目前悬崖民宿和仰仙村62、63栋设有电梯，其他住宿楼栋多数没有电梯。</strong><br>如果同行有老人、婴幼儿或行动不便的游客，建议预订前把需求说清楚，并让前台确认可安排楼栋。';
      if (/洗衣|烘衣|烘干/.test(q)) return '<strong>景区民宿有免费自助洗衣点。</strong><br>仰仙村62、63栋和仙宿02栋区域配有洗烘一体机，住店客人可自行前往使用。';
      if (/wifi|wi-fi|无线网|网络密码/.test(q)) return '<strong>客房 Wi‑Fi 密码是 wangxiangu，全拼小写。</strong><br>Wi‑Fi名称通常是房间号；如果没有看到对应名称，可以选择附近信号较强的网络尝试连接。';
      if (/硬枕|乳胶枕|荞麦枕|枕头/.test(q)) return '<strong>客房可按库存提供乳胶枕或荞麦枕。</strong><br>建议入住当天告诉管家或前台您偏好的枕头类型，工作人员会根据当日库存尽量协调。';
      if (/一次性.*(床单|被套)|床品.*消毒/.test(q)) return '<strong>酒店暂不提供一次性床单和被套。</strong><br>客房床品由正规洗涤机构清洗消毒；如果您有特殊卫生需求，建议自带合适用品。';
      if (/雨伞|雨衣|下雨.*伞/.test(q)) return '<strong>前台雨伞数量有限，紧张时会提供雨衣作为替代。</strong><br>客房雨伞可以归还到前台；如果正在景区里需要雨具，请向民宿前台说明房号、所在位置和需要数量。';
      if (/取电卡|房卡取电|送.*房卡/.test(q)) return '<strong>部分楼栋需要使用取电卡，包括仰仙村楼栋及仙宿部分区域。</strong><br>如果房内缺少取电卡，请向民宿前台提供房号，由客房工作人员核实并送达。';
      if (/水单|住宿账单|打印账单/.test(q)) return '<strong>住宿水单通常在办理入住后才能生成，可在前台申请打印。</strong><br>预付订单或房价保密订单可能无法由前台提供完整水单，需要回原付款渠道申请账单或发票。';
      if (/房间.*(零食|水果|饮料|饮用水).*(收费|免费)|迷你吧|客房.*食物/.test(q)) return '<strong>客房内标注为免费提供的饮用水、欢迎水果和零食可以安心使用。</strong><br>悬崖房型内的饮品与零食也可免费享用；其他有价商品请留意房内价目提示或先向前台确认。';
      if (/押金/.test(q)) return '<strong>普通散客目前通常不收住宿押金。</strong><br>旅行社团队和部分悬崖民宿订单可能需要押金；团队10间房参考收取 1000 元、悬崖民宿每间参考 500 元。退房核查无消费后原路退回，具体以订单和前台办理为准。';
      if (/行李.*(寄存|存放)|寄存.*行李/.test(q)) return '<strong>住店客人退房后可以在民宿中心免费寄存行李。</strong><br>游客中心也有自助寄存柜：中柜8小时15元、24小时内25元封顶；大柜8小时30元、24小时内45元封顶，超过24小时重新计费。';
      if (/贵重物品|现金.*寄存|保险柜/.test(q)) return '<strong>民宿中心行李房配有保险柜，可为住店客人提供贵重物品寄存。</strong><br>办理时需要本人到场并填写寄存表，是否符合寄存规定由前台现场确认。<div class="note">贵重物品请本人到民宿中心行李房办理，不要交给非指定人员。</div>';
      if (/冷藏|冷冻|冰箱.*寄存|药品.*寄存/.test(q)) return '<strong>冷藏、冷冻食品和药品不能直接按普通行李寄存。</strong><br>前台有冰箱，但需现场确认储存条件并签署相关说明；药品如有严格温控要求，请自备专业保存方式。<div class="note">到前台时请说明物品类型、温度要求和预计寄存时间。</div>';
      if (/早餐/.test(q) && !/房间.*(含|包含|送|赠)/.test(q)) return '<strong>早餐地点会随住宿区域和订单权益不同。</strong><div class="grid"><div class="cell"><b>白鹤餐厅／承远餐厅</b>自助早餐通常7:30—9:30</div><div class="cell"><b>老围楼特色早餐</b>通常8:00—10:00</div><div class="cell"><b>加购参考</b>1.2米及以下免费；1.2—1.5米58元；成人98元</div></div><div class="note">具体用餐地点、份数与儿童标准请以入住订单和前台指引为准。</div>';
      if (/健身房|无边际泳池|游泳池/.test(q)) return '<strong>仙宿区域有健身房和无边际泳池。</strong><br>住客通常凭房卡免费使用；健身房通常开放至 9:00—21:00，夏季泳池通常开放至 10:00—21:00。非住客参考价成人 80 元，1.2—1.4 米儿童 40 元，最终以现场开放和收费为准。';
      if (/ktv|棋牌室|麻将|阳光房|云集书院/.test(q)) return '<strong>景区民宿区设有棋牌室、KTV、阳光房和云集书院等休闲空间。</strong><br>棋牌室参考价258—288元/场，KTV参考价358—928元/场/4小时；开放时间多为12:30—23:00，周末可能延至24:00。<div class="note">包厢和场地属于实时档期，正式接入后可在预订页查看可选时段。</div>';
      if (/旅拍|汉服拍摄|拍照服务/.test(q)) return '<strong>景区住宿区有旅拍服务，可以提前沟通风格和档期。</strong><div class="grid"><div class="cell"><b>仰仙村·霓裳阁</b>若谷街杨家食府右侧<br>17779368654</div><div class="cell"><b>仙宿·铂爵旅拍</b>民宿中心前台右侧下坡约2分钟<br>15960756922</div></div><div class="note">部分房型权益含5张精修和1套特色服装，通常需提前12小时预约；是否包含、是否含妆造请以订单为准。</div>';
      if (/扎染券|草木染坊/.test(q)) return '<strong>草木染坊位于若谷街。</strong><br>如果住宿订单包含扎染体验券，请先查看订单权益或向前台核验；尚未领取时，需要工作人员核对订单后安排。<div class="note">到前台时准备入住人姓名、房号和订单页面即可。</div>';
      if (/房间.*(停水|断水|没水|停电|断电|没电|断网|没网)|空调.*(故障|不制冷|不制热|坏了)/.test(q)) return '<strong>给您添麻烦了，这类房间故障需要马上让工作人员处理。</strong><br>请就近联系民宿前台，并说明房号、故障现象，以及房内是否有老人或孩子；维修人员会先检查，无法短时修复时再结合房态协调后续方案。';
      if (/外卖/.test(q)) return '<strong>外卖员不能进入景区，酒店也暂不提供代取或送房服务。</strong><br>如已下单，需要到民宿中心门岗自取；也可以在景区内的餐厅、小吃街或老围楼选择餐食。';
      if (/按摩|擦鞋|擦皮鞋/.test(q)) return '<strong>酒店目前不提供上门按摩或擦鞋服务。</strong><br>客房内通常配有擦鞋布，可以自行使用。';
      if (/凌晨.*(吃|餐饮|夜宵)|半夜.*(吃|餐饮|夜宵)/.test(q)) return '<strong>凌晨后景区餐厅通常已经停止营业。</strong><br>部分客房可提供有价泡面、速热米饭、零食和饮料，是否可送房请联系前台确认。';

    function parkingPanel(language) {

      }

    }

      var layer = document.createElement('div');
      layer.id = 'parking-map-sheet';
      layer.className = 'ticket-backdrop';
      layer.setAttribute('role','dialog');

    function roomBookingDateISO(value) {
      var full = String(value || '').match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      var shortDate = String(value || '').match(/(\d{1,2})月(\d{1,2})日/);
      var today = new Date();
      var year = full ? parseInt(full[1],10) : today.getFullYear();
      var month = full ? parseInt(full[2],10) : shortDate ? parseInt(shortDate[1],10) : today.getMonth() + 1;
      var day = full ? parseInt(full[3],10) : shortDate ? parseInt(shortDate[2],10) : today.getDate();
      var candidate = new Date(year,month - 1,day);
      if (!full && candidate < new Date(today.getFullYear(),today.getMonth(),today.getDate())) year += 1;
      return year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    }

    function formatRoomOrderDate(date) {
      return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日';
    }

      }

    function parseGuestCountToken(token) {
      if (!token) return 0;
      if (/^\d+$/.test(token)) return parseInt(token,10);
      var digits = {'零':0,'一':1,'二':2,'两':2,'俩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
      if (token === '十') return 10;
      if (token.indexOf('十') >= 0) {
        var parts = token.split('十');
        return (parts[0] ? digits[parts[0]] : 1) * 10 + (parts[1] ? digits[parts[1]] : 0);
      }
      return digits[token] || 0;
    }

    function extractHotelDetails(raw) {
      var text = raw.replace(/\s+/g,'');
      var date = text.match(/(?:\d{4}年)?\d{1,2}月\d{1,2}日/);
      var countToken = '[一二两俩三四五六七八九十\\d]+';
      var people = text.match(new RegExp('(' + countToken + ')(?:人|位)'));
      var adultsAndChildren = text.match(new RegExp('(' + countToken + ')大(' + countToken + ')小'));
      var wordyFamily = text.match(new RegExp('(' + countToken + ')(?:位|个)?(?:大人|成人)[^，。；]*?(' + countToken + ')(?:位|个)?(?:儿童|孩子|小孩)'));
      var familySize = text.match(new RegExp('一家(' + countToken + ')口'));
      var guestCount = adultsAndChildren ? parseGuestCountToken(adultsAndChildren[1]) + parseGuestCountToken(adultsAndChildren[2]) : wordyFamily ? parseGuestCountToken(wordyFamily[1]) + parseGuestCountToken(wordyFamily[2]) : familySize ? parseGuestCountToken(familySize[1]) : people ? parseGuestCountToken(people[1]) : 0;
      var childAge = text.match(/(?:儿童|孩子|小孩)[^，。；]*?(\d{1,2})岁/);
      var preference = text.match(/大床|双床|亲子房?|滑梯房?|套房|景观房?|树屋/);
      var budget = text.match(/(\d{3,5})\s*(?:元)?(?:以内|以下|左右)/);
      var nights = text.match(new RegExp('(?:住|连住)?(' + countToken + ')(?:晚|夜)')) || text.match(new RegExp('(?:住|连住)(' + countToken + ')天'));
      return {
        date: date ? date[0] : '',
        people: guestCount,
        childAge: childAge ? parseInt(childAge[1],10) : null,
        noChild: /无儿童|没有儿童|不带孩子|没有孩子|都是成人/.test(text),
        preference: preference ? preference[0] : '',
        budget: budget ? parseInt(budget[1],10) : 0,
        nights: nights ? parseGuestCountToken(nights[1]) : 0
      };
    }

    function hotelDetailsScore(details) {
      return ['date','people','preference','budget','nights'].reduce(function(total,key){return total + (details[key] ? 1 : 0);},0) + (details.childAge !== null || details.noChild ? 1 : 0);
    }

        var stockOk = room.stockKind !== 'sold' && room.stockKind !== 'pending';

    function landmarkMatches(text) {
      var matches = [];
      Object.keys(LANDMARKS).forEach(function(name){
        var best = -1;
        LANDMARKS[name].aliases.forEach(function(alias){
          var index = text.indexOf(alias);
          if (index >= 0 && (best < 0 || index < best)) best = index;
        });
        if (best >= 0) matches.push({name:name,index:best});
      });
      return matches.sort(function(a,b){return a.index-b.index;});
    }

    function nextLandmarkStep() {
      if (!activeNavigation) return guideMapPanel();
      if (activeNavigation.index >= activeNavigation.path.length - 1) {
        var arrived = activeNavigation.path[activeNavigation.path.length - 1];
        activeNavigation = null;
        return '<strong>您已经到达“' + arrived + '”所在位置。</strong>' + '<div class="landmark-grid">' + landmarkCard(arrived) + '</div><div class="note">如果现场店招、围挡或临时通道与图示不同，请以工作人员指引为准。</div>';
      }
      var current = activeNavigation.path[activeNavigation.index];
      var next = activeNavigation.path[activeNavigation.index + 1];
      var instruction = activeNavigation.instruction || '沿主游线前行';
      return '<strong>这一段先只找“' + next + '”，不用判断东南西北。</strong><br>从“' + current + '”附近' + instruction + '，看到下面这个地标特征后回复“到了”，我再给下一段。<div class="landmark-grid">' + landmarkCard(next) + '</div><div class="note">图片标签会注明“现场实拍”或“地图局部图示”；现场临时封路或导向调整以工作人员指引为准。</div>';

    function landmarkNavigationResponse(text) {
      var matches = landmarkMatches(text);

        var confirmed = matches.length ? activeNavigation.path.indexOf(matches[matches.length - 1].name) : activeNavigation.index + 1;
        activeNavigation.index = confirmed >= 0 ? confirmed : activeNavigation.index + 1;
        return nextLandmarkStep();
      }
      if (matches.length >= 2) {
        var start = matches[0].name;
        var destination = matches[matches.length - 1].name;
        if (start === '岩铺广场' && destination === '老围楼') {
          activeNavigation = {path:[start,destination],index:0,instruction:'沿若谷街向北步行；约 8 分钟、450 米'};
          return '<strong>已经记下：从“岩铺广场”去“老围楼”。</strong><br>我会用节目现场图帮您确认目的地。' + nextLandmarkStep();
        }
        var startIndex = NAV_ROUTE.indexOf(start);
        var destinationIndex = NAV_ROUTE.indexOf(destination);
        if (startIndex >= 0 && destinationIndex >= 0 && startIndex !== destinationIndex) {
          var path = startIndex < destinationIndex ? NAV_ROUTE.slice(startIndex,destinationIndex + 1) : NAV_ROUTE.slice(destinationIndex,startIndex + 1).reverse();
          activeNavigation = {path:path,index:0};
          return '<strong>已经记下：从“' + start + '”去“' + destination + '”。</strong><br>我会一次只给一个容易确认的地标。' + nextLandmarkStep();
        }
      }
      if (matches.length === 1) {
        var only = matches[0].name;
        var isCurrent = /我在|现在在|当前位置|从/.test(text);
        return '<strong>' + (isCurrent ? '当前位置已记为“' + only + '”，还需要目的地。' : '目的地已记为“' + only + '”，还需要当前位置。') + '</strong><div class="landmark-grid">' + landmarkCard(only) + '</div><div class="nav-question">请按这个格式回复：<b>我现在在___，想去___。</b><br>当前位置可以说眼前的桥、广场、街名、店招或高楼，不需要说东南西北。</div>';
      }
      return guideMapPanel();
    }

    function ask(text) {
      if (!text.trim()) return;
      visitorJourneyStage = inferJourneyStage(text);
      addMessage(escapeHtml(text), 'user'); input.value = ''; showTyping();
      setTimeout(function(){
        var t = document.getElementById('typing'); if (t) t.remove();
        if (pendingReservationStore) {
          var storeName = pendingReservationStore;
          pendingReservationStore = '';
          addMessage(reservationReviewPanel(storeName,text), 'ai');
        } else {
          addMessage(withGuessQuestions(responseFor(text), text), 'ai');
        }
      }, 420);

    function activateDemoPersona(persona) {

    function startModuleFlow(question) {

      activeDemoPersona = null;
      ask(question);
    }

    function setVoiceState(active) {
      listening = active;
      voiceButton.classList.toggle('listening', active);
      voiceButton.setAttribute('aria-pressed', active ? 'true' : 'false');
      voiceButton.setAttribute('aria-label', active ? '停止语音输入' : '开始语音输入');
      voiceButton.title = active ? '正在聆听，点击停止' : '语音输入';
      input.placeholder = active ? '正在聆听，请说出您的问题…' : '请输入问题，或点击麦克风说话';
    }

    function setupVoiceInput() {
      if (!SpeechRecognitionAPI) {
        voiceButton.disabled = true;
        voiceButton.title = '当前浏览器不支持语音识别';
        return;
      }
      recognition = new SpeechRecognitionAPI();
      recognition.lang = 'zh-CN';
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;
      recognition.onstart = function(){ setVoiceState(true); };
      recognition.onresult = function(event){
        var transcript = '';
        for (var i = event.resultIndex; i < event.results.length; i++) transcript += event.results[i][0].transcript;
        input.value = transcript;
        input.focus();
      };
      recognition.onerror = function(event){
        setVoiceState(false);
        var messages = { 'not-allowed':'请允许麦克风权限后再试。', 'no-speech':'没有听到语音，请靠近麦克风再试。', 'audio-capture':'没有检测到可用麦克风。' };
        addMessage('<strong>语音输入暂时没有完成。</strong><br>' + (messages[event.error] || '请稍后重试，您也可以继续使用文字输入。'), 'ai');
      };
      recognition.onend = function(){ setVoiceState(false); };
      voiceButton.addEventListener('click', function(){
        if (listening) { recognition.stop(); return; }
        input.value = '';
        try { recognition.start(); } catch (e) { setVoiceState(false); }
      });
    }

      pendingAttractionNavigation = '';

      }
      var navStoreButton = e.target.closest('[data-nav-store]');
      if (navStoreButton) addMessage(navigationPanel(navStoreButton.getAttribute('data-nav-store')),'ai');
      var addProductButton = e.target.closest('[data-add-product]');

    }

      document.body.classList.add('services-open');
      serviceBackdrop.querySelector('[data-close-services]').focus();
    });
    serviceBackdrop.addEventListener('click',function(e){

    });
    document.addEventListener('keydown',function(e){
      if (serviceBackdrop.hidden) return;
      if (e.key === 'Escape') { closeServiceSheet(); return; }
      if (e.key === 'Tab') {
        var focusable = serviceBackdrop.querySelectorAll('button:not([disabled])');
        var first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    window.addEventListener('message',function(event){
      if (event.source !== window.parent) return;
      if (location.protocol !== 'file:' && event.origin !== location.origin) return;
      var payload = event.data || {};
      if (payload.type === 'wangxiangu:demo-ping') {
        window.parent.postMessage({ type: 'wangxiangu:demo-ready' }, location.origin);
        return;
      }
      if (payload.type !== 'wangxiangu:demo-question') return;
      activateDemoPersona(payload.persona);
      if (typeof payload.question === 'string' && payload.question.trim()) {
        input.value = payload.question.trim();
        input.focus();
      }
    });

      window.parent.postMessage({ type: 'wangxiangu:demo-ready' }, location.origin);
